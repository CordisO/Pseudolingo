<!-- splash.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="/assets/image/pseudolingo-logo.png" type="image/png">
  <title>Pseudolingo</title>
  <style>
    @font-face {
        font-family: "Dingos Stamp";
        src: url("/assets/fonts/Dingos-Stamp_Black.otf") format("truetype");
    }
    @import url("https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap");

    body {
      background-color: rgba(255, 255, 255, 0.8);
      color: #8d54ff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }

    /* Loading screen */
    .loading-body {
    background-color: white;
    color: #8d54ff;
    }

    .loading-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .logo-img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        filter: drop-shadow(0 8px 16px rgba(255, 255, 255, 0.3));
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .logo {
        font-size: 3rem;
        font-family: 'Dingos Stamp', sans-serif;
        color: #8d54ff;
        font-weight: 600;
        margin-bottom: 40px;
        -webkit-text-stroke: 2px #5a30ad;
    }

    .loader {
        width: 100px;
        aspect-ratio: 2;
        --_g: no-repeat radial-gradient(circle closest-side,#8d54ff 90%,#fff);
        background: 
            var(--_g) 0%   50%,
            var(--_g) 50%  50%,
            var(--_g) 100% 50%;
        background-size: calc(100%/3) 50%;
        animation: l3 1s infinite linear;
    }

    @keyframes l3 {
        20%{background-position:0%   0%, 50%  50%,100%  50%}
        40%{background-position:0% 100%, 50%   0%,100%  50%}
        60%{background-position:0%  50%, 50% 100%,100%   0%}
        80%{background-position:0%  50%, 50%  50%,100% 100%}
    }

    .tagline {
        font-size: 1rem;
        color: #8d54ff;
        margin-top: 20px;
        font-family: 'Balsamiq Sans', sans-serif;
    }

    @media (max-width: 600px) {
        .logo-img {
            width: 80px;
            height: 80px;
        }

        .logo {
            font-size: 2rem;
        }

        .loader {
            width: 70px;  
        }

        .tagline {
            font-size: 0.85rem;
        }
    }
  </style>
</head>
<body class="loading-body">
  <div class="loading-container">
    <img src="/assets/image/logo.png" alt="Pseudolingo Logo" class="logo-img">
    <h1 class="logo">Pseudolingo</h1>
    <div class="loader"></div>
    <p class="tagline">Create your own fantasy languages</p>
  </div>

  <script>
    // Only redirect after loading if on the loading screen
    if (document.body.classList.contains("loading-body")) {
        setTimeout(() => {
            window.location.href = "main.html";
        }, 3000);
    }
  </script>
</body>
</html>
